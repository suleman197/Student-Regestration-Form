<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-wrapper">
    <section class="form-card">

      <div class="form-header">
        <h1>Student Registration Form</h1>
        <p>Fill out the form carefully for university admission registration.</p>
      </div>

      <form>
        <h2>Personal Information</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" placeholder="Enter first name" required>
          </div>

          <div class="input-group">
            <label>Last Name</label>
            <input type="text" placeholder="Enter last name" required>
          </div>

          <div class="input-group">
            <label>Father Name</label>
            <input type="text" placeholder="Enter father name" required>
          </div>

          <div class="input-group">
            <label>Date of Birth</label>
            <input type="date" required>
          </div>

          <div class="input-group">
            <label>Gender</label>
            <select required>
              <option value="">Select gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>

          <div class="input-group">
            <label>CNIC / B-Form</label>
            <input type="text" placeholder="xxxxx-xxxxxxx-x" required>
          </div>
        </div>

        <h2>Contact Information</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="example@gmail.com" required>
          </div>

          <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="03xx-xxxxxxx" required>
          </div>

          <div class="input-group full-width">
            <label>Address</label>
            <textarea placeholder="Enter your complete address" required></textarea>
          </div>

          <div class="input-group">
            <label>City</label>
            <input type="text" placeholder="Enter city" required>
          </div>

          <div class="input-group">
            <label>Province</label>
            <select required>
              <option value="">Select province</option>
              <option>Punjab</option>
              <option>Sindh</option>
              <option>KPK</option>
              <option>Balochistan</option>
              <option>Gilgit Baltistan</option>
              <option>Azad Kashmir</option>
            </select>
          </div>
        </div>

        <h2>Academic Information</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>Previous Qualification</label>
            <select required>
              <option value="">Select qualification</option>
              <option>Matric</option>
              <option>Intermediate</option>
              <option>Diploma</option>
              <option>Bachelor</option>
            </select>
          </div>

          <div class="input-group">
            <label>Passing Year</label>
            <input type="number" placeholder="2024" required>
          </div>

          <div class="input-group">
            <label>Total Marks</label>
            <input type="number" placeholder="1100" required>
          </div>

          <div class="input-group">
            <label>Obtained Marks</label>
            <input type="number" placeholder="950" required>
          </div>

          <div class="input-group">
            <label>Program Applying For</label>
            <select required>
              <option value="">Select program</option>
              <option>BS Software Engineering</option>
              <option>BS Computer Science</option>
              <option>BS Artificial Intelligence</option>
              <option>BS Data Science</option>
              <option>BBA</option>
            </select>
          </div>

          <div class="input-group">
            <label>Shift</label>
            <select required>
              <option value="">Select shift</option>
              <option>Morning</option>
              <option>Evening</option>
            </select>
          </div>
        </div>

        <h2>Documents Upload</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>Upload Picture</label>
            <input type="file" required>
          </div>

          <div class="input-group">
            <label>Upload CNIC / B-Form</label>
            <input type="file" required>
          </div>

          <div class="input-group">
            <label>Upload Result Card</label>
            <input type="file" required>
          </div>

          <div class="input-group">
            <label>Upload Domicile</label>
            <input type="file">
          </div>
        </div>

        <h2>Emergency Contact</h2>

        <div class="form-grid">
          <div class="input-group">
            <label>Guardian Name</label>
            <input type="text" placeholder="Enter guardian name" required>
          </div>

          <div class="input-group">
            <label>Guardian Phone</label>
            <input type="tel" placeholder="03xx-xxxxxxx" required>
          </div>

          <div class="input-group">
            <label>Relation</label>
            <input type="text" placeholder="Father / Brother / Uncle" required>
          </div>

          <div class="input-group">
            <label>Occupation</label>
            <input type="text" placeholder="Enter occupation">
          </div>
        </div>

        <div class="terms">
          <input type="checkbox" required>
          <label>I confirm that all information provided above is correct.</label>
        </div>

        <div class="buttons">
          <button type="reset" class="reset-btn">Reset</button>
          <button type="submit" class="submit-btn">Submit Registration</button>
        </div>

      </form>
    </section>
  </main>

</body>
</html>
